<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nightlife Pass - Control de Listas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .line-through-fade {
          text-decoration: line-through;
          opacity: 0.5;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen pb-10">

<!-- Header -->
<header class="bg-gray-800 border-b border-gray-700 p-4 sticky top-0 z-10 shadow-lg">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
        <h1 class="text-xl font-bold text-indigo-400">🔥 Nightlife Control</h1>
        <span class="text-xs bg-indigo-900 text-indigo-200 px-2.5 py-1 rounded-full">Netlify Ready</span>
    </div>
</header>

<main class="max-w-4xl mx-auto p-4 space-y-6">

    <!-- Buscador en Puerta -->
    <section class="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-md">
        <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-2">🔍 Buscador de Puerta</h2>
        <input
                type="text"
                id="searchInput"
                placeholder="Buscar por Nombre, DNI o Teléfono..."
                class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                oninput="filtrarInvitados()"
        >
    </section>

    <!-- Formulario para Cargar Invitados -->
    <section class="bg-gray-800 p-5 rounded-xl border border-gray-700">
        <h2 class="text-lg font-bold text-gray-200 mb-4">➕ Registrar Invitado</h2>
        <form id="guestForm" onsubmit="agregarInvitado(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs text-gray-400 mb-1">Nombre Completo</label>
                <input type="text" id="nombre" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white">
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1">DNI / Documento</label>
                <input type="text" id="documento" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white">
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1">Teléfono</label>
                <input type="tel" id="telefono" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white">
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1">Promotor / RPP / Owner</label>
                <input type="text" id="rpp" placeholder="Ej: Juan RPP o Casa/PO" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white">
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1">Tipo de Lista</label>
                <select id="tipoLista" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white">
                    <option value="Free">Free</option>
                    <option value="Cumpleaños">Cumpleaños</option>
                    <option value="Descuento">Descuento / Consumición</option>
                </select>
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1">Horario Límite Free</label>
                <input type="time" id="horaLimite" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white">
            </div>
            <div class="md:col-span-2 mt-2">
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-lg transition">Guardar en Lista</button>
            </div>
        </form>
    </section>

    <!-- Lista de Invitados -->
    <section class="bg-gray-800 p-5 rounded-xl border border-gray-700">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-bold text-gray-200">📋 Listados Generales</h2>
            <span id="counter" class="text-xs text-gray-400">0 Registrados</span>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm text-gray-300">
                <thead class="bg-gray-900 text-gray-400 uppercase text-xs">
                <tr>
                    <th class="p-3">Estado</th>
                    <th class="p-3">Nombre</th>
                    <th class="p-3">DNI / Tel</th>
                    <th class="p-3">RPP</th>
                    <th class="p-3">Tipo / Límite</th>
                    <th class="p-3 text-center">Ingreso</th>
                </tr>
                </thead>
                <tbody id="guestList" class="divide-y divide-gray-700">
                <!-- Cargado dinámicamente -->
                </tbody>
            </table>
        </div>
    </section>

</main>

<script>
    let invitados = JSON.parse(localStorage.getItem('nightlife_guests')) || [];

    function guardar() {
      localStorage.setItem('nightlife_guests', JSON.stringify(invitados));
      renderizar();
    }

    function agregarInvitado(e) {
      e.preventDefault();
      const nuevo = {
        id: Date.now(),
        nombre: document.getElementById('nombre').value,
        documento: document.getElementById('documento').value,
        telefono: document.getElementById('telefono').value,
        rpp: document.getElementById('rpp').value,
        tipoLista: document.getElementById('tipoLista').value,
        horaLimite: document.getElementById('horaLimite').value || 'Sin Límite',
        ingresado: false
      };
      invitados.push(nuevo);
      document.getElementById('guestForm').reset();
      guardar();
    }

    function toggleIngreso(id) {
      invitados = invitados.map(item => {
        if (item.id === id) item.ingresado = !item.ingresado;
        return item;
      });
      guardar();
    }

    function renderizar(filtrados = null) {
      const lista = filtrados || invitados;
      const tbody = document.getElementById('guestList');
      document.getElementById('counter').innerText = `${lista.length} Invitados`;
      tbody.innerHTML = '';

      if (lista.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-500">No hay registros cargados.</td></tr>`;
        return;
      }

      lista.forEach(item => {
        const tr = document.createElement('tr');
        tr.className = item.ingresado ? 'bg-gray-900/50 line-through-fade' : 'hover:bg-gray-750';

        tr.innerHTML = `
          <td class="p-3">
            <span class="px-2 py-1 text-xs rounded-full ${item.ingresado ? 'bg-green-900 text-green-300' : 'bg-yellow-900 text-yellow-300'}">
              ${item.ingresado ? 'Ingresó' : 'Pendiente'}
            </span>
          </td>
          <td class="p-3 font-semibold text-white">${item.nombre}</td>
          <td class="p-3 text-xs text-gray-400">${item.documento}<br>${item.telefono}</td>
          <td class="p-3 text-indigo-300">${item.rpp}</td>
          <td class="p-3">
            <span class="font-medium">${item.tipoLista}</span>
            <span class="block text-xs text-gray-400">${item.horaLimite !== 'Sin Límite' ? 'Hasta ' + item.horaLimite : ''}</span>
          </td>
          <td class="p-3 text-center">
            <button
              onclick="toggleIngreso(${item.id})"
              class="px-3 py-1.5 rounded-lg text-xs font-bold transition ${item.ingresado ? 'bg-gray-700 text-gray-300' : 'bg-emerald-600 hover:bg-emerald-500 text-white'}"
            >
              ${item.ingresado ? 'Desmarcar' : '✅ listo'}
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function filtrarInvitados() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!query) {
        renderizar();
        return;
      }
      const filtrados = invitados.filter(i =>
        i.nombre.toLowerCase().includes(query) ||
        i.documento.toLowerCase().includes(query) ||
        i.telefono.toLowerCase().includes(query)
      );
      renderizar(filtrados);
    }

    renderizar();
</script>
</body>
</html>
